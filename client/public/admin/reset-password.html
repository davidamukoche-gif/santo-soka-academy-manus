<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set Administrator Password — Santos Soka Academy</title>
    <link rel="stylesheet" href="/css/style.css?v=20260922-admin" />
  </head>
  <body class="admin-login-page">
    <header class="site-header"><div class="nav"><a href="/" class="brand"><div class="brand-badge"><img src="/assets/crest_48b5cf38.jpg" alt="Santos Soka Academy crest" /></div><div class="brand-name">Santos Soka Academy<small>Dagoretti • Nairobi</small></div></a><a class="text-link" href="/">Back to website</a></div></header>
    <main class="admin-login-shell">
      <section class="admin-login-card" aria-labelledby="reset-title">
        <span class="eyebrow" style="color:var(--green-700); border-color:rgba(15,107,50,.35);">Private access</span>
        <h1 id="reset-title">Set a new administrator password</h1>
        <p>Choose a strong password for the academy administrator account.</p>
        <form id="admin-reset-form" novalidate>
          <label for="new-password">New password</label>
          <input id="new-password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters" />
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat your password" />
          <div id="admin-reset-status" class="form-msg" role="status" aria-live="polite"></div>
          <button class="btn btn-primary" type="submit">Save new password</button>
        </form>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-api.js?v=20260922-admin"></script>
    <script src="/js/admin-reset-password.js?v=20260922-admin"></script>
  </body>
</html>
